name: Scale Small AI Release Health Monitor

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Continuous 6-hour monitor or explicit exhaustive incident sweep
        required: true
        default: continuous
        type: choice
        options:
          - continuous
          - incident
      lookback_hours:
        description: Continuous supports 1-6 hours; incident supports 1-168 hours
        required: false
        default: '6'
        type: string
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: scale-small-ai-release-health-monitor
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify current organization release health
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scan_mode == 'incident' && 45 || 12 }}
    env:
      SSAI_RELEASE_MONITOR_GITHUB_TOKEN: ${{ secrets.SSAI_RELEASE_MONITOR_READ_TOKEN }}
      SSAI_RELEASE_MONITOR_STUCK_MINUTES: '45'
      SSAI_RELEASE_MONITOR_MODE: ${{ inputs.scan_mode || 'continuous' }}
      SSAI_RELEASE_MONITOR_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '6' }}
      SSAI_RELEASE_MONITOR_MAX_REQUESTS: ${{ inputs.scan_mode == 'incident' && '3500' || '600' }}
      SSAI_RELEASE_MONITOR_RATE_RESERVE: ${{ inputs.scan_mode == 'incident' && '250' || '1000' }}
      SSAI_RELEASE_MONITOR_API_CONCURRENCY: '6'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Verify monitor credential is available
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#SSAI_RELEASE_MONITOR_GITHUB_TOKEN}" -lt 20 ]; then
            echo "::error::SSAI_RELEASE_MONITOR_READ_TOKEN must provide read-only access to the in-scope private SSAI repositories and their Actions metadata"
            exit 1
          fi

      - name: Reconcile current health and every recent failure
        run: node scripts/verify-org-release-health.mjs
