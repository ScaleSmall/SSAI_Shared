name: Scale Small AI Release Health Monitor
run-name: Release health monitor [${{ inputs.scan_mode == 'incident' && 'incident:168h' || format('continuous:{0}h', inputs.lookback_hours || '6') }}]

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Continuous 6-hour monitor or explicit exhaustive incident sweep
        required: true
        default: continuous
        type: choice
        options:
          - continuous
          - incident
      lookback_hours:
        description: Continuous supports 1-6 hours; incident mode always performs an exhaustive 168-hour scan
        required: false
        default: '6'
        type: string
  schedule:
    - cron: '9,24,39,54 * * * *'

concurrency:
  # Preserve every pending native or future fallback writer and serialize all
  # incident-state mutations through one non-cancelling repository queue.
  group: scale-small-ai-release-health-monitor-v2
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    # Keep the canonical check name stable across the workflow-identity cutover
    # so historical failures and self-deployment exclusions retain one stream.
    name: Verify current organization release health
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
    environment:
      name: release-health-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scan_mode == 'incident' && 45 || 12 }}
    outputs:
      scan_completed: ${{ steps.reconcile.outputs.scan_completed }}
      health_degraded: ${{ steps.reconcile.outputs.health_degraded }}
      incident_state_changed: ${{ steps.reconcile.outputs.incident_state_changed }}
      state_persistence_required: ${{ steps.reconcile.outputs.state_persistence_required }}
      incident_state: ${{ steps.reconcile.outputs.incident_state }}
      notification_outcome: ${{ steps.reconcile.outputs.notification_outcome }}
      notification_reconciliation_required: ${{ steps.reconcile.outputs.notification_reconciliation_required }}
      incident_delivery_identity: ${{ steps.reconcile.outputs.incident_delivery_identity }}
    env:
      SSAI_RELEASE_MONITOR_STATE_HMAC_EPOCH: v1
      SSAI_RELEASE_MONITOR_STUCK_MINUTES: '45'
      SSAI_RELEASE_MONITOR_MODE: ${{ inputs.scan_mode || 'continuous' }}
      SSAI_RELEASE_MONITOR_LOOKBACK_HOURS: ${{ inputs.scan_mode == 'incident' && '168' || inputs.lookback_hours || '6' }}
      SSAI_RELEASE_MONITOR_MAX_REQUESTS: ${{ inputs.scan_mode == 'incident' && '3500' || '600' }}
      SSAI_RELEASE_MONITOR_RATE_RESERVE: ${{ inputs.scan_mode == 'incident' && '250' || '1000' }}
      SSAI_RELEASE_MONITOR_API_CONCURRENCY: '6'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact protected workflow context
        shell: bash
        env:
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
          EXPECTED_REPOSITORY: ScaleSmall/SSAI_Shared
          EXPECTED_WORKFLOW_REF: ScaleSmall/SSAI_Shared/.github/workflows/release-health-monitor.yml@refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if ! [[ "$ACTUAL_EVENT" =~ ^(schedule|workflow_dispatch)$ ]] || [ "$ACTUAL_REPOSITORY" != "$EXPECTED_REPOSITORY" ] || [ "$ACTUAL_REF" != "$EXPECTED_REF" ] || [ "$ACTUAL_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ] || ! [[ "$ACTUAL_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$checked_out_sha" != "$ACTUAL_SHA" ]; then
            echo "::error::Release-health monitor failed exact protected workflow admission."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Mint selected-repository release-health GitHub App token
        id: release_health_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.SSAI_RELEASE_MONITOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.SSAI_RELEASE_MONITOR_APP_PRIVATE_KEY }}
          owner: ScaleSmall
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-deployments: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Restore bounded scheduled-incident state
        id: restore_release_health_state
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ssai-release-health-monitor/state.json
          key: ssai-release-health-state-v6-v1-lookup
          restore-keys: |
            ssai-release-health-state-v6-v1-
            ssai-release-health-state-v4-v1-
            ssai-release-health-state-v3-v1-
            ssai-release-health-state-v2-v1-

      - name: Verify monitor credentials are available
        shell: bash
        env:
          SSAI_RELEASE_MONITOR_GITHUB_TOKEN: ${{ steps.release_health_app_token.outputs.token }}
          SSAI_RELEASE_MONITOR_GITHUB_INSTALLATION_ID: ${{ steps.release_health_app_token.outputs.installation-id }}
          SSAI_RELEASE_MONITOR_EXPECTED_INVENTORY_SHA256: ${{ secrets.SSAI_RELEASE_MONITOR_EXPECTED_INVENTORY_SHA256 }}
          SSAI_RELEASE_MONITOR_STATE_HMAC_KEY: ${{ secrets.SSAI_RELEASE_MONITOR_STATE_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ "${#SSAI_RELEASE_MONITOR_GITHUB_TOKEN}" -lt 20 ] || ! [[ "$SSAI_RELEASE_MONITOR_GITHUB_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]] || [ "${#SSAI_RELEASE_MONITOR_STATE_HMAC_KEY}" -lt 32 ] || ! [[ "$SSAI_RELEASE_MONITOR_EXPECTED_INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The protected release-health-monitor environment credential is unavailable"
            exit 1
          fi

      - name: Reconcile current health and every recent failure
        id: reconcile
        env:
          SSAI_RELEASE_MONITOR_GITHUB_TOKEN: ${{ steps.release_health_app_token.outputs.token }}
          SSAI_RELEASE_MONITOR_EXPECTED_INVENTORY_SHA256: ${{ secrets.SSAI_RELEASE_MONITOR_EXPECTED_INVENTORY_SHA256 }}
          SSAI_RELEASE_MONITOR_STATE_HMAC_KEY: ${{ secrets.SSAI_RELEASE_MONITOR_STATE_HMAC_KEY }}
          SSAI_RELEASE_MONITOR_STATE_CACHE_MATCHED_KEY: ${{ steps.restore_release_health_state.outputs.cache-matched-key }}
          SSAI_RELEASE_MONITOR_STATE_CACHE_PREFIX: ssai-release-health-state-v6-v1-
          SSAI_RELEASE_MONITOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SSAI_RELEASE_MONITOR_STATE_PATH: ${{ runner.temp }}/ssai-release-health-monitor/state.json
          # A completed scheduled scan must first persist and deliver its exact
          # incident state. A later job restores the degraded conclusion.
          SSAI_RELEASE_MONITOR_DEFER_DEGRADED_EXIT: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const hostedActions = String(process.env.GITHUB_ACTIONS || '').toLowerCase() === 'true';
          try {
            const monitor = await import('./scripts/verify-org-release-health.mjs');
            await monitor.executeReleaseHealthMonitorEntryPoint(monitor.runReleaseHealthMonitor);
          } catch (caught) {
            if (hostedActions) {
              console.error('::error::Release-health monitor failed closed before aggregate reporting.');
            } else {
              console.error(caught instanceof Error ? caught.stack || caught.message : String(caught));
            }
            process.exitCode = 1;
          }
          NODE

      - name: Persist required scheduled-incident state
        if: ${{ always() && github.event_name == 'schedule' && steps.reconcile.outputs.state_persistence_required == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ssai-release-health-monitor/state.json
          key: ${{ steps.reconcile.outputs.incident_state_cache_key }}

      - name: Verify required scheduled-incident state is visible
        id: verify_release_health_state
        if: ${{ always() && github.event_name == 'schedule' && steps.reconcile.outputs.state_persistence_required == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ssai-release-health-monitor/state.json
          key: ${{ steps.reconcile.outputs.incident_state_cache_key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Require scheduled-incident state persistence
        id: require_release_health_state
        if: ${{ always() && github.event_name == 'schedule' && steps.reconcile.outputs.state_persistence_required == 'true' }}
        shell: bash
        env:
          EXPECTED_STATE_KEY: ${{ steps.reconcile.outputs.incident_state_cache_key }}
          MATCHED_STATE_KEY: ${{ steps.verify_release_health_state.outputs.cache-matched-key }}
          STATE_CACHE_HIT: ${{ steps.verify_release_health_state.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$STATE_CACHE_HIT" != 'true' ] || [ "$MATCHED_STATE_KEY" != "$EXPECTED_STATE_KEY" ]; then
            echo "::error::Release-health monitor failed closed"
            exit 1
          fi

  deliver:
    name: Deliver managed incident and conclude
    needs: scan
    if: ${{ always() && github.event_name == 'schedule' && needs.scan.result == 'success' && needs.scan.outputs.scan_completed == 'true' }}
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Verify exact protected delivery context
        shell: bash
        env:
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
          EXPECTED_REPOSITORY: ScaleSmall/SSAI_Shared
          EXPECTED_WORKFLOW_REF: ScaleSmall/SSAI_Shared/.github/workflows/release-health-monitor.yml@refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$ACTUAL_EVENT" != 'schedule' ] || [ "$ACTUAL_REPOSITORY" != "$EXPECTED_REPOSITORY" ] || [ "$ACTUAL_REF" != "$EXPECTED_REF" ] || [ "$ACTUAL_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ] || ! [[ "$ACTUAL_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$checked_out_sha" != "$ACTUAL_SHA" ]; then
            echo "::error::Release-health delivery failed exact protected workflow admission."
            exit 1
          fi

      - name: Reconcile the managed GitHub incident issue
        id: reconcile_managed_incident
        if: ${{ needs.scan.outputs.notification_reconciliation_required == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SSAI_RELEASE_MONITOR_INCIDENT_STATE: ${{ needs.scan.outputs.incident_state }}
          SSAI_RELEASE_MONITOR_NOTIFICATION_OUTCOME: ${{ needs.scan.outputs.notification_outcome }}
          SSAI_RELEASE_MONITOR_DELIVERY_IDENTITY: ${{ needs.scan.outputs.incident_delivery_identity }}
        run: node scripts/sync-release-health-incident-issue.mjs

      - name: Restore degraded release-health conclusion after delivery
        if: ${{ always() && needs.scan.outputs.health_degraded == 'true' }}
        shell: bash
        run: |
          echo "::error::The completed release-health scan found a new or worsened incident"
          exit 1
