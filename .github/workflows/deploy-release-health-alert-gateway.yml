name: Deploy release-health alert gateway
run-name: Release-health alert gateway candidate at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha: { description: Exact protected main commit, required: true, type: string }
      expected_config_sha256: { description: LF-normalized gateway config SHA-256, required: true, type: string }
      expected_source_sha256: { description: Exact gateway source digest, required: true, type: string }
      allow_first_bootstrap: { description: Permit contained first creation, required: true, default: false, type: boolean }

permissions:
  contents: read
concurrency:
  group: release-health-alert-gateway-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'ScaleSmall/SSAI_Shared' && github.repository_id == '1183552904' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true &&
      github.sha == inputs.expected_sha && github.workflow_sha == inputs.expected_sha && github.run_attempt == 1
    environment:
      name: release-health-controller-production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GATEWAY_CONFIG: workers/release-health-alert-gateway/wrangler.jsonc
      GATEWAY_NAME: ssai-release-health-alert-gateway
      GATEWAY_DOMAIN: alerts.scalesmall.ai
      GATEWAY_ZONE_NAME: scalesmall.ai
      RATE_LIMITER_NAMESPACE_ID: '735104001'
    steps:
      - name: Record hard job budget
        shell: bash
        run: |
          set -euo pipefail
          gateway_job_started_epoch="$(date +%s)"
          [[ "$gateway_job_started_epoch" =~ ^[0-9]{10}$ ]]
          echo "GATEWAY_JOB_STARTED_EPOCH=$gateway_job_started_epoch" >> "$GITHUB_ENV"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: { ref: '${{ inputs.expected_sha }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24' }
      - name: Verify exact protected identity and contracts
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SSAI_EXPECTED_ALERT_GATEWAY_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
          SSAI_EXPECTED_ALERT_GATEWAY_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REPOSITORY" = ScaleSmall/SSAI_Shared
          test "$GITHUB_REPOSITORY_ID" = 1183552904
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test '${{ github.workflow_sha }}' = "$EXPECTED_SHA"
          test '${{ github.ref_protected }}' = true
          test '${{ github.run_attempt }}' = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          timeout --signal=TERM --kill-after=15s 5m npm ci
          timeout --signal=TERM --kill-after=15s 2m node scripts/verify-release-health-alert-gateway.mjs
          timeout --signal=TERM --kill-after=15s 2m node scripts/verify-release-health-alert-gateway-deploy.mjs
          node -e "if(require('./node_modules/wrangler/package.json').version!=='4.127.1')process.exit(1)"
      - name: Dry-run immutable candidate
        shell: bash
        env:
          ALERT_HMAC_KEY: ${{ secrets.SSAI_RELEASE_CONTROLLER_ALERT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          candidate_dry_run_secrets="$RUNNER_TEMP/gateway-candidate-dry-run-secrets.json"
          trap 'rm -f -- "$candidate_dry_run_secrets"' EXIT
          node -e 'const fs=require("node:fs");const v=process.env.ALERT_HMAC_KEY;if(!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(v||"")||Buffer.from(v,"base64").length<32||Buffer.from(v,"base64").length>128||Buffer.from(v,"base64").toString("base64")!==v)process.exit(1);fs.writeFileSync(process.argv[1],JSON.stringify({ALERT_HMAC_KEY:v}),{mode:0o600});' "$candidate_dry_run_secrets"
          timeout --signal=TERM --kill-after=15s 3m ./node_modules/.bin/wrangler versions upload --config "$GATEWAY_CONFIG" --name "$GATEWAY_NAME" \
            --preview-alias "c-${GITHUB_SHA:0:12}" --tag "$GITHUB_SHA" --message "candidate ${GITHUB_SHA}" \
            --secrets-file "$candidate_dry_run_secrets" --strict --dry-run --outdir "$RUNNER_TEMP/gateway-dry-run" >/dev/null
          rm -f -- "$candidate_dry_run_secrets"
          trap - EXIT
          unset ALERT_HMAC_KEY
      - name: Candidate-first deploy, attestation, promotion, and rollback
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SSAI_RELEASE_CONTROLLER_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SSAI_RELEASE_CONTROLLER_CLOUDFLARE_API_TOKEN }}
          ALERT_HMAC_KEY: ${{ secrets.SSAI_RELEASE_CONTROLLER_ALERT_SIGNING_KEY }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
          ALLOW_FIRST_BOOTSTRAP: ${{ inputs.allow_first_bootstrap }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GATEWAY_JOB_STARTED_EPOCH" =~ ^[0-9]{10}$ ]]
          gateway_operation_deadline_epoch=$((GATEWAY_JOB_STARTED_EPOCH+3300))
          gateway_rollback_reserve_seconds=1200
          gateway_promotion_deadline_epoch=$((gateway_operation_deadline_epoch-gateway_rollback_reserve_seconds))
          api=https://api.cloudflare.com/client/v4
          alias="c-${GITHUB_SHA:0:12}"
          message="release-health-alert-gateway ${GITHUB_SHA} config=${EXPECTED_CONFIG_SHA256} source=${EXPECTED_SOURCE_SHA256}"
          promotion_message="promote ${GITHUB_SHA}"
          domain_inventory_path="accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=$GATEWAY_NAME"
          hostname_inventory_path="accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$GATEWAY_DOMAIN"
          previous_deployment_id= previous_version_id= previous_domain_id= candidate_deployment_id= candidate_version_id= candidate_domain_id= candidate_secrets= bootstrap_dir= bootstrap_config= bootstrap_secrets=
          traffic_mutated=false domain_preexisting=false domain_attach_attempted=false domain_created_by_run=false bootstrap=false bootstrap_mutation_attempted=false committed=false legacy_contained_previous=false rollback_mode=false
          gateway_failure_stage=account-id-shape
          rollback_message="automatic rollback after ${GITHUB_SHA}"
          report_gateway_failure_stage() {
            local stage="${1:-unclassified}"
            case "$stage" in
              account-id-shape|api-token-shape|signing-key-shape|secret-file-write|secret-file-mode|account-get|account-validate|service-domain-get|service-domain-validate|hostname-domain-get|hostname-domain-validate|domain-count|preexisting-domain-id|preexisting-domain-hostname|preexisting-domain-detail-get|preexisting-domain-detail-validate|deployments-get|deployment-list-validate|deployment-id|version-id|bootstrap-authorization|bootstrap-script-routes|bootstrap-staging|bootstrap-dry-run|bootstrap-deploy|deployment-ids-validate|deployment-detail-get|deployment-detail-validate|version-detail-get|version-detail-validate|secrets-get|secrets-validate|settings-get|settings-observability|settings-bindings|subdomain-get|subdomain-validate|scripts-get|script-routes|active-version-bindings|bootstrap-domain-absence|domain-ready|live-health|preflight-secret-cleanup|candidate-upload|candidate-preview|promotion|ingress|final-attestation|unclassified) ;;
              *) stage=unclassified ;;
            esac
            printf '::error::Gateway deployment failed at an allowlisted stage (stage=%s).\n' "$stage"
          }
          request_timeout_seconds() {
            local maximum="$1" now remaining
            if test "$rollback_mode" = false && { test "$traffic_mutated" = true || test "$bootstrap_mutation_attempted" = true; } && test "$committed" != true; then
              now="$(date +%s)" || return 1
              [[ "$now" =~ ^[0-9]{10}$ ]] || return 1
              remaining=$((gateway_promotion_deadline_epoch-now))
              test "$remaining" -gt 0 || return 1
              if test "$remaining" -lt "$maximum"; then maximum="$remaining"; fi
            fi
            printf '%s' "$maximum"
          }
          bounded_sleep() {
            local delay="$1" now remaining
            if test "$rollback_mode" = false && { test "$traffic_mutated" = true || test "$bootstrap_mutation_attempted" = true; } && test "$committed" != true; then
              now="$(date +%s)" || return 1
              [[ "$now" =~ ^[0-9]{10}$ ]] || return 1
              remaining=$((gateway_promotion_deadline_epoch-now))
              test "$remaining" -gt "$delay" || return 1
            fi
            sleep "$delay"
          }
          require_forward_budget() {
            local minimum="$1" now remaining
            now="$(date +%s)" || return 1
            [[ "$now" =~ ^[0-9]{10}$ ]] || return 1
            remaining=$((gateway_promotion_deadline_epoch-now))
            test "$remaining" -ge "$minimum"
          }
          api_get() {
            local path="$1" output="$2" temporary request_timeout
            rm -f -- "$output"
            temporary="$(mktemp "${output}.tmp.XXXXXX")" || return 1
            request_timeout="$(request_timeout_seconds 20)" || { rm -f -- "$temporary"; return 1; }
            if curl --fail --silent --show-error --max-time "$request_timeout" --proto '=https' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$path" -o "$temporary" && jq -e '.success==true' "$temporary" >/dev/null; then
              mv -f -- "$temporary" "$output"
            else
              rm -f -- "$temporary" "$output"
              return 1
            fi
          }
          api_get_status() {
            local path="$1" output="$2" temporary code request_timeout
            rm -f -- "$output"
            temporary="$(mktemp "${output}.tmp.XXXXXX")" || return 1
            request_timeout="$(request_timeout_seconds 20)" || { rm -f -- "$temporary"; return 1; }
            if code="$(curl --silent --show-error --max-time "$request_timeout" --proto '=https' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --write-out '%{http_code}' "$api/$path" -o "$temporary")" && [[ "$code" =~ ^[0-9]{3}$ ]] && jq -e 'type=="object" and (.success|type)=="boolean"' "$temporary" >/dev/null; then
              mv -f -- "$temporary" "$output"
              printf '%s' "$code"
            else
              rm -f -- "$temporary" "$output"
              return 1
            fi
          }
          api_post_json() {
            local path="$1" body="$2" output="$3" temporary request_timeout
            rm -f -- "$output"
            temporary="$(mktemp "${output}.tmp.XXXXXX")" || return 1
            request_timeout="$(request_timeout_seconds 20)" || { rm -f -- "$temporary"; return 1; }
            if curl --fail --silent --show-error --max-time "$request_timeout" --proto '=https' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$body" "$api/$path" -o "$temporary" && jq -e '.success==true' "$temporary" >/dev/null; then
              mv -f -- "$temporary" "$output"
            else
              rm -f -- "$temporary" "$output"
              return 1
            fi
          }
          api_put_json() {
            local path="$1" body="$2" output="$3" temporary request_timeout
            rm -f -- "$output"
            temporary="$(mktemp "${output}.tmp.XXXXXX")" || return 1
            request_timeout="$(request_timeout_seconds 20)" || { rm -f -- "$temporary"; return 1; }
            if curl --fail --silent --show-error --max-time "$request_timeout" --proto '=https' -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "@$body" "$api/$path" -o "$temporary" && jq -e '.success==true' "$temporary" >/dev/null; then
              mv -f -- "$temporary" "$output"
            else
              rm -f -- "$temporary" "$output"
              return 1
            fi
          }
          api_delete() {
            local path="$1" output="$2" temporary request_timeout
            rm -f -- "$output"
            temporary="$(mktemp "${output}.tmp.XXXXXX")" || return 1
            request_timeout="$(request_timeout_seconds 20)" || { rm -f -- "$temporary"; return 1; }
            if curl --fail --silent --show-error --max-time "$request_timeout" --proto '=https' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$path" -o "$temporary" && jq -e '.success==true' "$temporary" >/dev/null; then
              mv -f -- "$temporary" "$output"
            else
              rm -f -- "$temporary" "$output"
              return 1
            fi
          }
          latest_deployment_id() { jq -er '.result.deployments|select(type=="array" and length>0)|.[0]|select((.versions|type)=="array" and (.versions|length)==1 and .versions[0].percentage==100)|.id|select(type=="string")' "$1"; }
          latest_version_id() { jq -er '.result.deployments|select(type=="array" and length>0)|.[0]|select((.versions|type)=="array" and (.versions|length)==1 and .versions[0].percentage==100)|.versions[0].version_id|select(type=="string")' "$1"; }
          valid_uuid() { [[ "$1" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]; }
          valid_domain_id() { [[ "$1" =~ ^[a-f0-9]{32}$ ]]; }
          deployment_ok() { jq -e --arg deployment "$2" --arg version "$3" '.result.id==$deployment and (.result.versions|type)=="array" and (.result.versions|length)==1 and .result.versions[0].version_id==$version and .result.versions[0].percentage==100' "$1" >/dev/null; }
          promoted_deployment_ok() { jq -e --arg deployment "$2" --arg version "$3" --arg message "$4" '.result.id==$deployment and .result.source=="api" and .result.strategy=="percentage" and (.result.created_on|type)=="string" and (.result.versions|type)=="array" and (.result.versions|length)==1 and .result.versions[0].version_id==$version and .result.versions[0].percentage==100 and .result.annotations["workers/message"]==$message' "$1" >/dev/null; }
          binding_ok() { jq -e --arg ns "$RATE_LIMITER_NAMESPACE_ID" '((.result.resources.bindings//.result.bindings//[])|length)==3 and any((.result.resources.bindings//.result.bindings//[])[];.=={name:"ALERT_INGEST_RATE_LIMITER",type:"ratelimit",namespace_id:$ns,simple:{limit:60,period:60}}) and any((.result.resources.bindings//.result.bindings//[])[];.name=="ALERT_HMAC_KEY" and .type=="secret_text") and any((.result.resources.bindings//.result.bindings//[])[];.=={name:"CF_VERSION_METADATA",type:"version_metadata"})' "$1" >/dev/null; }
          legacy_binding_ok() { jq -e --arg ns "$RATE_LIMITER_NAMESPACE_ID" '((.result.resources.bindings//.result.bindings//[])|length)==2 and any((.result.resources.bindings//.result.bindings//[])[];.=={name:"ALERT_INGEST_RATE_LIMITER",type:"ratelimit",namespace_id:$ns,simple:{limit:60,period:60}}) and any((.result.resources.bindings//.result.bindings//[])[];.name=="ALERT_HMAC_KEY" and .type=="secret_text")' "$1" >/dev/null; }
          known_settings_binding_ok() { binding_ok "$1" || legacy_binding_ok "$1"; }
          exact_secret_ok() { jq -e '(.result|type)=="array" and (.result|length)==1 and .result[0].name=="ALERT_HMAC_KEY" and .result[0].type=="secret_text"' "$1" >/dev/null; }
          bootstrap_version_owned() { jq -e --arg id "$2" --arg sha "$GITHUB_SHA" '.result.id==$id and ((.result.annotations//.result.metadata.annotations//{}) as $a|$a["workers/tag"]==$sha and $a["workers/message"]==("contained bootstrap "+$sha))' "$1" >/dev/null; }
          legacy_contained_version_ok() { jq -e --arg id "$2" '.result.id==$id and ((.result.annotations//.result.metadata.annotations//{}) as $a|($a["workers/tag"]|type)=="string" and ($a["workers/tag"]|test("^[a-f0-9]{40}$")) and $a["workers/message"]==("contained bootstrap "+$a["workers/tag"]))' "$1" >/dev/null && legacy_binding_ok "$1"; }
          candidate_version_ok() { jq -e --arg id "$2" --arg sha "$GITHUB_SHA" --arg msg "$message" --arg alias "$alias" '.result.metadata as $metadata|(.result.annotations//.result.metadata.annotations//{}) as $annotations|([$metadata.hasPreview?,$metadata.has_preview?]|map(select(type=="boolean"))) as $preview_flags|.result.id==$id and ($metadata.created_on|type)=="string" and ($preview_flags|length)>=1 and all($preview_flags[];.==true) and $annotations["workers/tag"]==$sha and $annotations["workers/message"]==$msg and $annotations["workers/alias"]==$alias' "$1" >/dev/null && binding_ok "$1"; }
          rollback_deployment_ok() { if test "$2" = "$previous_deployment_id"; then deployment_ok "$1" "$2" "$previous_version_id"; else promoted_deployment_ok "$1" "$2" "$previous_version_id" "$rollback_message"; fi; }
          observability_ok() { jq -e '.result.observability.enabled==true and .result.observability.head_sampling_rate==1 and .result.observability.logs.enabled==true and .result.observability.logs.head_sampling_rate==1 and .result.observability.logs.invocation_logs==true and .result.logpush==false and ((.result.tail_consumers//[])|length)==0' "$1" >/dev/null; }
          domain_ok() { jq -e --arg id "$2" --arg h "$GATEWAY_DOMAIN" --arg s "$GATEWAY_NAME" --arg z "$GATEWAY_ZONE_NAME" '.result.id==$id and .result.hostname==$h and .result.service==$s and .result.zone_name==$z and (.result.zone_id|type)=="string" and (.result.zone_id|test("^[a-f0-9]{32}$")) and (.result.cert_id|type)=="string" and (.result.cert_id|test("^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$")) and (.result.environment//"production")=="production"' "$1" >/dev/null; }
          domain_list_complete() { jq -e '(.result|type)=="array" and ((has("result_info")|not) or .result_info==null or ((.result_info|type)=="object" and ((.result_info|has("page")|not) or ((.result_info.page|type)=="number" and (.result_info.page|floor)==.result_info.page and .result_info.page==1)) and ((.result_info|has("per_page")|not) or ((.result_info.per_page|type)=="number" and (.result_info.per_page|floor)==.result_info.per_page and .result_info.per_page>=(.result|length))) and ((.result_info|has("count")|not) or ((.result_info.count|type)=="number" and (.result_info.count|floor)==.result_info.count and .result_info.count==(.result|length))) and ((.result_info|has("total_pages")|not) or ((.result_info.total_pages|type)=="number" and (.result_info.total_pages|floor)==.result_info.total_pages and .result_info.total_pages>=0 and .result_info.total_pages<=1 and ((.result|length)==0 or .result_info.total_pages==1)))))' "$1" >/dev/null; }
          script_routes_absent() {
            local input="$1" expected_present="$2"
            jq -e --arg service "$GATEWAY_NAME" --argjson expected_present "$expected_present" '(.result|type)=="array" and (([.result[]|select(.id==$service)]) as $matches|if $expected_present then ($matches|length)==1 and ($matches[0]|has("routes")) and ($matches[0].routes|type)=="array" and ($matches[0].routes|length)==0 else ($matches|length)==0 end)' "$input" >/dev/null
          }
          timestamp_gte() { node -e 'const actual=Date.parse(process.argv[1]),bound=Date.parse(process.argv[2]);if(!Number.isFinite(actual)||!Number.isFinite(bound)||actual<bound)process.exit(1)' "$1" "$2"; }
          make_deployment_body() { jq -n --arg version "$1" --arg message "$2" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":$message}}' > "$3"; }
          wait_active() {
            local expected_version="$1" expected_deployment="$2" forbidden_deployment="$3" allowed_transient_version="$4" label="$5" deadline delay active_deployment active_version
            deadline=$((SECONDS+60)); delay=1
            while test "$SECONDS" -le "$deadline"; do
              if api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-${label}-list.json"; then
                active_deployment="$(latest_deployment_id "$RUNNER_TEMP/gateway-${label}-list.json")" || active_deployment=
                active_version="$(latest_version_id "$RUNNER_TEMP/gateway-${label}-list.json")" || active_version=
                if test "$active_version" = "$expected_version" && { test -z "$expected_deployment" || test "$active_deployment" = "$expected_deployment"; } && { test -z "$forbidden_deployment" || test "$active_deployment" != "$forbidden_deployment"; } && valid_uuid "$active_deployment"; then
                  if api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments/$active_deployment" "$RUNNER_TEMP/gateway-${label}-deployment.json" && deployment_ok "$RUNNER_TEMP/gateway-${label}-deployment.json" "$active_deployment" "$expected_version"; then printf '%s' "$active_deployment"; return 0; fi
                elif valid_uuid "$active_deployment" && valid_uuid "$active_version" && { test -z "$allowed_transient_version" || test "$active_version" != "$allowed_transient_version"; }; then
                  return 2
                fi
              fi
              bounded_sleep "$delay" || return 1
              if test "$delay" -lt 5; then delay=$((delay*2)); if test "$delay" -gt 5; then delay=5; fi; fi
            done
            return 1
          }
          reconcile_traffic_rollback() {
            local label="$1" deadline delay active_deployment active_version
            valid_uuid "$previous_deployment_id" || return 1
            valid_uuid "$previous_version_id" || return 1
            valid_uuid "$candidate_version_id" || return 1
            if test -n "$candidate_deployment_id"; then valid_uuid "$candidate_deployment_id" || return 1; fi
            make_deployment_body "$previous_version_id" "$rollback_message" "$RUNNER_TEMP/gateway-${label}-body.json" || return 1
            deadline=$((SECONDS+120)); delay=1
            while test "$SECONDS" -le "$deadline"; do
              if api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-${label}-list.json"; then
                active_deployment="$(latest_deployment_id "$RUNNER_TEMP/gateway-${label}-list.json")" || active_deployment=
                active_version="$(latest_version_id "$RUNNER_TEMP/gateway-${label}-list.json")" || active_version=
                if valid_uuid "$active_deployment" && valid_uuid "$active_version" && api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments/$active_deployment" "$RUNNER_TEMP/gateway-${label}-deployment.json" && deployment_ok "$RUNNER_TEMP/gateway-${label}-deployment.json" "$active_deployment" "$active_version"; then
                  if test "$active_version" = "$previous_version_id" && rollback_deployment_ok "$RUNNER_TEMP/gateway-${label}-deployment.json" "$active_deployment"; then
                    printf '%s' "$active_deployment"
                    return 0
                  fi
                  if test "$active_version" != "$candidate_version_id" || { test -n "$candidate_deployment_id" && test "$active_deployment" != "$candidate_deployment_id"; } || ! promoted_deployment_ok "$RUNNER_TEMP/gateway-${label}-deployment.json" "$active_deployment" "$candidate_version_id" "$promotion_message"; then
                    return 2
                  fi
                  api_post_json "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments?force=true" "$RUNNER_TEMP/gateway-${label}-body.json" "$RUNNER_TEMP/gateway-${label}-response.json" || :
                fi
              fi
              bounded_sleep "$delay" || return 1
              if test "$delay" -lt 10; then delay=$((delay*2)); if test "$delay" -gt 10; then delay=10; fi; fi
            done
            return 1
          }
          attest_rollback_active() {
            local expected_deployment="$1" label="$2" active_deployment active_version
            api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-${label}-list.json" || return 1
            active_deployment="$(latest_deployment_id "$RUNNER_TEMP/gateway-${label}-list.json")" || return 1
            active_version="$(latest_version_id "$RUNNER_TEMP/gateway-${label}-list.json")" || return 1
