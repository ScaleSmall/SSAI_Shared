          gateway_failure_stage=promotion
          promoted="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make_deployment_body "$candidate_version_id" "$promotion_message" "$RUNNER_TEMP/gateway-promotion-body.json"
          traffic_mutated=true
          expected_candidate_deployment=
          if api_post_json "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-promotion-body.json" "$RUNNER_TEMP/gateway-promotion-response.json"; then
