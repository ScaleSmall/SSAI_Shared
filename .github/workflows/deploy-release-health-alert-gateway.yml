            gateway_failure_stage=deployment-list-validate
            jq -e '.success==true' "$RUNNER_TEMP/gateway-preflight.json" >/dev/null
            gateway_failure_stage=deployment-id
            previous_deployment_id="$(latest_deployment_id "$RUNNER_TEMP/gateway-preflight.json")"
            gateway_failure_stage=version-id
            previous_version_id="$(latest_version_id "$RUNNER_TEMP/gateway-preflight.json")"
          elif test "$code" = 404; then
            gateway_failure_stage=bootstrap-authorization
            test "$ALLOW_FIRST_BOOTSTRAP" = true; test "$domain_preexisting" = false; bootstrap=true
            gateway_failure_stage=bootstrap-script-routes
            api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "$RUNNER_TEMP/gateway-bootstrap-preflight-scripts.json"
            script_routes_absent "$RUNNER_TEMP/gateway-bootstrap-preflight-scripts.json" false
