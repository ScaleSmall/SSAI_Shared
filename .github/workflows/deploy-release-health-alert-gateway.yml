            bootstrap_dir="$RUNNER_TEMP/gateway-bootstrap"
            install -d -m 700 -- "$bootstrap_dir"
            cp -R -- "$(dirname "$GATEWAY_CONFIG")/." "$bootstrap_dir/"
            bootstrap_config="$bootstrap_dir/$(basename "$GATEWAY_CONFIG")"
            bootstrap_secrets="$bootstrap_dir/bootstrap-secrets.json"
            jq '.routes=[]' "$GATEWAY_CONFIG" > "$bootstrap_config"
            node -e 'const fs=require("node:fs");const secret=process.env.ALERT_HMAC_KEY;if(!secret)process.exit(1);fs.writeFileSync(process.argv[1],JSON.stringify({ALERT_HMAC_KEY:secret}),{mode:0o600});' "$bootstrap_secrets"
            gateway_failure_stage=bootstrap-dry-run
            timeout --signal=TERM --kill-after=15s 3m ./node_modules/.bin/wrangler deploy --config "$bootstrap_config" --name "$GATEWAY_NAME" --secrets-file "$bootstrap_secrets" --dry-run --outdir "$RUNNER_TEMP/gateway-bootstrap-dry-run" >/dev/null
            require_forward_budget 900
            bootstrap_mutation_attempted=true
            gateway_failure_stage=bootstrap-deploy
            timeout --signal=TERM --kill-after=15s 10m ./node_modules/.bin/wrangler deploy --config "$bootstrap_config" --name "$GATEWAY_NAME" --secrets-file "$bootstrap_secrets" --message "contained bootstrap ${GITHUB_SHA}" --tag "$GITHUB_SHA"
            gateway_failure_stage=deployments-get
            api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-preflight.json"
            gateway_failure_stage=deployment-id
            previous_deployment_id="$(latest_deployment_id "$RUNNER_TEMP/gateway-preflight.json")"
            gateway_failure_stage=version-id
            previous_version_id="$(latest_version_id "$RUNNER_TEMP/gateway-preflight.json")"
          else exit 41; fi
          gateway_failure_stage=deployment-ids-validate
          valid_uuid "$previous_deployment_id"; valid_uuid "$previous_version_id"
          gateway_failure_stage=deployment-detail-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments/$previous_deployment_id" "$RUNNER_TEMP/gateway-previous-deployment.json"
          gateway_failure_stage=deployment-detail-validate
          deployment_ok "$RUNNER_TEMP/gateway-previous-deployment.json" "$previous_deployment_id" "$previous_version_id"
          gateway_failure_stage=version-detail-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/versions/$previous_version_id" "$RUNNER_TEMP/gateway-previous.json"
          gateway_failure_stage=version-detail-validate
          jq -e --arg id "$previous_version_id" '.result.id==$id' "$RUNNER_TEMP/gateway-previous.json" >/dev/null
          gateway_failure_stage=secrets-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/secrets" "$RUNNER_TEMP/gateway-secrets.json"
          gateway_failure_stage=secrets-validate
          exact_secret_ok "$RUNNER_TEMP/gateway-secrets.json"
          gateway_failure_stage=settings-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/settings" "$RUNNER_TEMP/gateway-preflight-settings.json"
          gateway_failure_stage=settings-observability
          observability_ok "$RUNNER_TEMP/gateway-preflight-settings.json"
          gateway_failure_stage=settings-bindings
          known_settings_binding_ok "$RUNNER_TEMP/gateway-preflight-settings.json"
          gateway_failure_stage=subdomain-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/subdomain" "$RUNNER_TEMP/gateway-preflight-subdomain.json"
          gateway_failure_stage=subdomain-validate
          jq -e '.result.enabled==false and .result.previews_enabled==true' "$RUNNER_TEMP/gateway-preflight-subdomain.json" >/dev/null
          gateway_failure_stage=scripts-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "$RUNNER_TEMP/gateway-preflight-scripts.json"
          gateway_failure_stage=script-routes
          script_routes_absent "$RUNNER_TEMP/gateway-preflight-scripts.json" true
          gateway_failure_stage=active-version-bindings
          if binding_ok "$RUNNER_TEMP/gateway-previous.json"; then
            :
          elif test "$bootstrap" = false && test "$domain_preexisting" = false && legacy_contained_version_ok "$RUNNER_TEMP/gateway-previous.json" "$previous_version_id" && wait_domain_absent legacy-contained-preflight; then
            legacy_contained_previous=true
          else
            exit 42
          fi
          if test "$bootstrap" = true; then
            gateway_failure_stage=bootstrap-domain-absence
            wait_domain_absent bootstrap-post-deploy
          fi
          if test "$domain_preexisting" = true; then
            gateway_failure_stage=domain-ready
            test "$(wait_domain "$previous_domain_id" preflight-existing)" = "$previous_domain_id"
            gateway_failure_stage=live-health
            wait_health "https://$GATEWAY_DOMAIN/healthz" preflight-live "$previous_version_id"
          fi
          gateway_failure_stage=preflight-secret-cleanup
          if test -n "$bootstrap_secrets"; then rm -f -- "$bootstrap_secrets"; bootstrap_secrets=; fi
          gateway_failure_stage=candidate-upload
          require_forward_budget 360
          upload_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -f -- "$RUNNER_TEMP/gateway-candidate.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/gateway-candidate.jsonl" timeout --signal=TERM --kill-after=15s 5m ./node_modules/.bin/wrangler versions upload --config "$GATEWAY_CONFIG" --name "$GATEWAY_NAME" --secrets-file "$candidate_secrets" --preview-alias "$alias" --tag "$GITHUB_SHA" --message "$message" --strict
          rm -f -- "$candidate_secrets"
          candidate_secrets=
          unset ALERT_HMAC_KEY
          jq -se --arg worker "$GATEWAY_NAME" '[.[]|select(.type=="version-upload")] as $events|($events|length)==1 and ($events[0]|.version==1 and .worker_name==$worker and (.worker_tag|type)=="string" and (.worker_tag|length)>0 and (.version_id|type)=="string" and (.preview_url|type)=="string" and (.preview_alias_url|type)=="string" and (.timestamp|type)=="string")' "$RUNNER_TEMP/gateway-candidate.jsonl" >/dev/null
          candidate_version_id="$(jq -rs '[.[]|select(.type=="version-upload")][0].version_id//empty' "$RUNNER_TEMP/gateway-candidate.jsonl")"
          preview_url="$(jq -rs '[.[]|select(.type=="version-upload")][0].preview_alias_url//empty' "$RUNNER_TEMP/gateway-candidate.jsonl")"
          candidate_event_timestamp="$(jq -rs '[.[]|select(.type=="version-upload")][0].timestamp//empty' "$RUNNER_TEMP/gateway-candidate.jsonl")"
          timestamp_gte "$candidate_event_timestamp" "$upload_started"
