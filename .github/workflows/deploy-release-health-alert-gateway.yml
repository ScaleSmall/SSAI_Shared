              jq -e --arg id "$previous_domain_id" --arg h "$GATEWAY_DOMAIN" --arg s "$GATEWAY_NAME" '(.result|length)==1 and .result[0].id==$id and .result[0].hostname==$h and .result[0].service==$s' "$RUNNER_TEMP/gateway-${label}-hostname-domains.json" >/dev/null || return 1
              api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$previous_domain_id" "$RUNNER_TEMP/gateway-${label}-domain-final.json" || return 1
              domain_ok "$RUNNER_TEMP/gateway-${label}-domain-final.json" "$previous_domain_id" || return 1
            else
              api_get "$domain_inventory_path" "$RUNNER_TEMP/gateway-${label}-service-domains.json" || return 1
              domain_list_complete "$RUNNER_TEMP/gateway-${label}-service-domains.json" || return 1
              jq -e '(.result|length)==0' "$RUNNER_TEMP/gateway-${label}-service-domains.json" >/dev/null || return 1
              api_get "$hostname_inventory_path" "$RUNNER_TEMP/gateway-${label}-hostname-domains.json" || return 1
              domain_list_complete "$RUNNER_TEMP/gateway-${label}-hostname-domains.json" || return 1
              jq -e '(.result|length)==0' "$RUNNER_TEMP/gateway-${label}-hostname-domains.json" >/dev/null || return 1
            fi
            attest_rollback_active "$expected_deployment" "${label}-end"
          }
          finish() {
            rc=$?
            trap - EXIT
            set +e
            rollback_mode=true
            if test "$committed" != true && test "$rc" -eq 0; then rc=93; fi
            forward_rc="$rc"
            if test "$forward_rc" -ne 0; then report_gateway_failure_stage "$gateway_failure_stage"; fi
            version_rollback_rc=0 domain_rollback_rc=0 bootstrap_containment_rc=0 cleanup_rc=0
            rollback_deployment_id= safe_to_rollback_traffic=true
            if test "$committed" != true && test "$domain_preexisting" = false; then
              if test "$domain_attach_attempted" = true; then
                reconcile_owned_domain_rollback rollback-domain || { domain_rollback_rc=96; safe_to_rollback_traffic=false; }
              elif test "$traffic_mutated" = true; then
                wait_domain_absent rollback-domain-never-attached || { domain_rollback_rc=96; safe_to_rollback_traffic=false; }
              fi
            fi
            if test "$committed" != true && test "$traffic_mutated" = true && test "$safe_to_rollback_traffic" = true; then
              rollback_deployment_id="$(reconcile_traffic_rollback rollback-traffic)" || version_rollback_rc=95
              if test "$version_rollback_rc" -eq 0 && ! valid_uuid "$rollback_deployment_id"; then version_rollback_rc=95; fi
            fi
            if test "$committed" != true && test "$traffic_mutated" = true && test "$version_rollback_rc" -eq 0 && test "$domain_rollback_rc" -eq 0; then
              attest_previous_provider_state "$rollback_deployment_id" rollback-final || version_rollback_rc=98
            fi
            if test "$committed" != true && test "$bootstrap_mutation_attempted" = true; then
              contain_bootstrap bootstrap-containment || bootstrap_containment_rc=94
            fi
            if test -n "$candidate_secrets"; then rm -f -- "$candidate_secrets" || cleanup_rc=99; fi
            if test -n "$bootstrap_secrets"; then rm -f -- "$bootstrap_secrets" || cleanup_rc=99; fi
            unset ALERT_HMAC_KEY
            rm -rf -- "$RUNNER_TEMP/gateway-dry-run" "$RUNNER_TEMP/gateway-bootstrap-dry-run" || cleanup_rc=99
            if test -n "$bootstrap_dir"; then rm -rf -- "$bootstrap_dir" || cleanup_rc=99; fi
            rm -f -- "$RUNNER_TEMP"/gateway-*.json "$RUNNER_TEMP"/gateway-*.jsonl "$RUNNER_TEMP"/gateway-*.headers "$RUNNER_TEMP"/gateway-*.tmp.* || cleanup_rc=99
            if test "$version_rollback_rc" -ne 0; then echo "::error::Gateway traffic rollback was not proven (code $version_rollback_rc)."; fi
            if test "$domain_rollback_rc" -ne 0; then echo "::error::Gateway domain rollback was not proven (code $domain_rollback_rc)."; fi
            if test "$safe_to_rollback_traffic" = false; then echo "::error::Gateway candidate traffic was intentionally left active because removing or disproving run-created ingress was not proven."; fi
            if test "$bootstrap_containment_rc" -ne 0; then echo "::error::Gateway bootstrap containment was not proven (code $bootstrap_containment_rc)."; fi
            if test "$cleanup_rc" -ne 0; then echo "::error::Gateway runner cleanup was not proven (code $cleanup_rc)."; fi
            if test "$version_rollback_rc" -ne 0; then rc="$version_rollback_rc"; elif test "$domain_rollback_rc" -ne 0; then rc="$domain_rollback_rc"; elif test "$bootstrap_containment_rc" -ne 0; then rc="$bootstrap_containment_rc"; elif test "$cleanup_rc" -ne 0; then rc="$cleanup_rc"; fi
            exit "$rc"
          }
          trap finish EXIT
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          gateway_failure_stage=api-token-shape
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20
          gateway_failure_stage=signing-key-shape
          node -e "const v=process.env.ALERT_HMAC_KEY;if(!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(v||'')||Buffer.from(v,'base64').length<32||Buffer.from(v,'base64').length>128||Buffer.from(v,'base64').toString('base64')!==v)process.exit(1)"
          candidate_secrets="$RUNNER_TEMP/gateway-candidate-secrets.json"
          gateway_failure_stage=secret-file-write
          node -e 'const fs=require("node:fs");const secret=process.env.ALERT_HMAC_KEY;if(!secret)process.exit(1);fs.writeFileSync(process.argv[1],JSON.stringify({ALERT_HMAC_KEY:secret}),{mode:0o600});' "$candidate_secrets"
          gateway_failure_stage=secret-file-mode
          test "$(stat -c '%a' "$candidate_secrets")" = 600
          gateway_failure_stage=account-get
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID" "$RUNNER_TEMP/gateway-account.json"
          gateway_failure_stage=account-validate
          jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result.id==$id' "$RUNNER_TEMP/gateway-account.json" >/dev/null
          gateway_failure_stage=service-domain-get
          api_get "$domain_inventory_path" "$RUNNER_TEMP/gateway-domain-preflight-list.json"
          gateway_failure_stage=service-domain-validate
          domain_list_complete "$RUNNER_TEMP/gateway-domain-preflight-list.json"
          gateway_failure_stage=hostname-domain-get
          api_get "$hostname_inventory_path" "$RUNNER_TEMP/gateway-hostname-preflight-list.json"
          gateway_failure_stage=hostname-domain-validate
          domain_list_complete "$RUNNER_TEMP/gateway-hostname-preflight-list.json"
          gateway_failure_stage=domain-count
          domain_count="$(jq -er '.result|length' "$RUNNER_TEMP/gateway-domain-preflight-list.json")"
          hostname_domain_count="$(jq -er '.result|length' "$RUNNER_TEMP/gateway-hostname-preflight-list.json")"
          if test "$domain_count" = 1; then
            test "$hostname_domain_count" = 1
            domain_preexisting=true
            gateway_failure_stage=preexisting-domain-id
            previous_domain_id="$(jq -er '.result[0].id' "$RUNNER_TEMP/gateway-domain-preflight-list.json")"
            valid_domain_id "$previous_domain_id"
            gateway_failure_stage=preexisting-domain-hostname
            jq -e --arg id "$previous_domain_id" --arg h "$GATEWAY_DOMAIN" --arg s "$GATEWAY_NAME" '(.result|length)==1 and .result[0].id==$id and .result[0].hostname==$h and .result[0].service==$s' "$RUNNER_TEMP/gateway-hostname-preflight-list.json" >/dev/null
            gateway_failure_stage=preexisting-domain-detail-get
            api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$previous_domain_id" "$RUNNER_TEMP/gateway-domain-preflight.json"
            gateway_failure_stage=preexisting-domain-detail-validate
            domain_ok "$RUNNER_TEMP/gateway-domain-preflight.json" "$previous_domain_id"
          elif test "$domain_count" = 0; then
            test "$hostname_domain_count" = 0
          else
            exit 40
          fi
          gateway_failure_stage=deployments-get
          code="$(api_get_status "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments" "$RUNNER_TEMP/gateway-preflight.json")"
