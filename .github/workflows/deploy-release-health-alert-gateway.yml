          require_forward_budget 30
          jq -n --arg sha "$GITHUB_SHA" --arg deployment "$candidate_deployment_id" --arg version "$candidate_version_id" --arg previous_deployment "$previous_deployment_id" --arg previous "$previous_version_id" --arg domain "$candidate_domain_id" --arg config "$EXPECTED_CONFIG_SHA256" --arg source "$EXPECTED_SOURCE_SHA256" --argjson bootstrap "$bootstrap" --argjson domain_preexisting "$domain_preexisting" --argjson legacy_contained_previous "$legacy_contained_previous" '{schema:"ssai-release-health-alert-gateway-deployment-evidence-v3",commit_sha:$sha,candidate_deployment_id:$deployment,candidate_version_id:$version,previous_deployment_id:$previous_deployment,previous_version_id:$previous,domain_id:$domain,domain_preexisting:$domain_preexisting,config_sha256:$config,source_sha256:$source,first_bootstrap:$bootstrap,legacy_contained_previous:$legacy_contained_previous,traffic_percent:100,health:"healthy",health_schema:"ssai-release-health-alert-gateway-health-v2",version_metadata_binding:"CF_VERSION_METADATA",rate_limit_namespace:"735104001",expected_secret_names:["ALERT_HMAC_KEY"],rollback_armed:true}' > "$RUNNER_TEMP/gateway-evidence.json"
