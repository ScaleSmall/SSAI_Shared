          preview_host="$(node -e "const u=new URL(process.argv[1]);if(u.protocol!=='https:'||u.pathname!=='/'||u.search||u.hash)process.exit(1);process.stdout.write(u.hostname)" "$preview_url")"
          [[ "$preview_host" =~ ^${alias}-${GATEWAY_NAME}\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.workers\.dev$ ]]
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/versions/$candidate_version_id" "$RUNNER_TEMP/gateway-candidate-version.json"
          candidate_version_ok "$RUNNER_TEMP/gateway-candidate-version.json" "$candidate_version_id"
          candidate_created_on="$(jq -er '.result.metadata.created_on' "$RUNNER_TEMP/gateway-candidate-version.json")"
          timestamp_gte "$candidate_created_on" "$upload_started"
