          test "$(latest_deployment_id "$RUNNER_TEMP/gateway-recheck.json")" = "$previous_deployment_id"
          test "$(latest_version_id "$RUNNER_TEMP/gateway-recheck.json")" = "$previous_version_id"
          ! jq -e --arg c "$candidate_version_id" 'any(.result.deployments[].versions[]?;.version_id==$c)' "$RUNNER_TEMP/gateway-recheck.json" >/dev/null
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments/$previous_deployment_id" "$RUNNER_TEMP/gateway-recheck-deployment.json"
          deployment_ok "$RUNNER_TEMP/gateway-recheck-deployment.json" "$previous_deployment_id" "$previous_version_id"
          now_epoch="$(date +%s)"
          [[ "$now_epoch" =~ ^[0-9]{10}$ ]]
          test "$now_epoch" -le "$gateway_promotion_deadline_epoch"
