          fi
          candidate_deployment_id="$(wait_active "$candidate_version_id" "$expected_candidate_deployment" "$previous_deployment_id" "$previous_version_id" promote)"
          valid_uuid "$candidate_deployment_id"; test "$candidate_deployment_id" != "$previous_deployment_id"
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/deployments/$candidate_deployment_id" "$RUNNER_TEMP/gateway-post-deployment.json"
          promoted_deployment_ok "$RUNNER_TEMP/gateway-post-deployment.json" "$candidate_deployment_id" "$candidate_version_id" "$promotion_message"
          candidate_deployed_on="$(jq -er '.result.created_on' "$RUNNER_TEMP/gateway-post-deployment.json")"
          timestamp_gte "$candidate_deployed_on" "$promoted"
          gateway_failure_stage=ingress
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/settings" "$RUNNER_TEMP/gateway-settings.json"
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/secrets" "$RUNNER_TEMP/gateway-secrets.json"
          api_get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$GATEWAY_NAME/subdomain" "$RUNNER_TEMP/gateway-subdomain.json"
          binding_ok "$RUNNER_TEMP/gateway-settings.json"; observability_ok "$RUNNER_TEMP/gateway-settings.json"
          exact_secret_ok "$RUNNER_TEMP/gateway-secrets.json"
