name: Propagate to consumer apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_connect:
        description: Dispatch SSAI_Connect rebuild after TikTok review is complete.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions: {}

concurrency:
  group: propagate-consumers-${{ github.repository }}-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_connect == 'true' && github.run_id || 'dashboard-only' }}
  cancel-in-progress: false

jobs:
  trigger-rebuilds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject historical or non-authoritative producer runs
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${SOURCE_REPOSITORY}" = 'ScaleSmall/SSAI_Shared' ]
          [ "${SOURCE_REF}" = 'refs/heads/main' ]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_EVENT}" =~ ^(push|workflow_dispatch)$ ]]
          if [ "${RUN_ATTEMPT}" != '1' ]; then
            echo '::error::Historical workflow reruns are prohibited; start a new workflow_dispatch run from current main.'
            exit 1
          fi

      - name: Check out the exact authoritative Shared source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Skip protected Connect propagation
        if: ${{ github.event_name == 'push' || inputs.dispatch_connect != 'true' }}
        run: |
          echo "SSAI_Connect dispatch is intentionally skipped while connect.scalesmall.ai is reserved for TikTok OAuth review."

      - name: Attest Dashboard consumer, dispatch v2, and witness a fresh run
        env:
          SSAI_DASHBOARD_DISPATCH_TOKEN: ${{ secrets.SSAI_DASHBOARD_DISPATCH_TOKEN }}
        run: |
          node scripts/dispatch-dashboard-update.mjs

      - name: Trigger SSAI_Connect rebuild
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_connect == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SSAI_CONNECT_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The dedicated SSAI_Connect dispatch token is not configured."
            exit 1
          fi

          if [ "$SOURCE_REPOSITORY" != 'ScaleSmall/SSAI_Shared' ] || [ "$SOURCE_REF" != 'refs/heads/main' ]; then
            echo "::error::Refusing protected Connect propagation from anything except SSAI_Shared main."
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing protected Connect propagation with an invalid source commit."
            exit 1
          fi

          jq -cn \
            --arg sha "$SOURCE_SHA" \
            '{event_type:"shared-updated",client_payload:{ref:$sha}}' \
            | gh api repos/ScaleSmall/SSAI_Connect/dispatches \
                --method POST \
                --input - \
                --silent
